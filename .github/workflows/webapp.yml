name: Публикация мини-приложения

# Мини-приложение раздаётся GitHub Pages из ветки gh-pages.
# Адрес зафиксирован и передан организаторам, менять его нельзя.

on:
  push:
    branches: [main]
    paths:
      - 'src/Domovoy.WebApp/**'
      - '.github/workflows/webapp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webapp-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Domovoy.WebApp/package-lock.json

      - name: Установка зависимостей
        working-directory: src/Domovoy.WebApp
        run: npm ci

      - name: Сборка
        working-directory: src/Domovoy.WebApp
        env:
          # Пока прод-хостинг не поднят (задача 0.5), переменная пустая и приложение
          # показывает состояние «сервис не подключён» вместо белого экрана.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # Публикуем обычным git, без сторонних экшенов: одна зависимость меньше.
      - name: Публикация в gh-pages
        working-directory: src/Domovoy.WebApp/dist
        run: |
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка мини-приложения из ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
