# Конфигурация развёртывания бэкенда в Amvera Cloud.
#
# Здесь описан только прод. Локальный запуск и проверка решения идут через
# compose.yaml в корне — он поднимает все компоненты одной командой, как требует
# формат сдачи. Разница между ними одна: в проде PostgreSQL берётся управляемым
# кластером, а не поднимается контейнером рядом. Версия СУБД и схема те же,
# миграции применяются при старте приложения.
#
# docker-compose Amvera не поддерживает, поэтому образ собирается из нашего
# Dockerfile: он же несёт корневой сертификат Минцифры, без которого не встанет
# TLS-соединение с platform-api2.max.ru.

meta:
  environment: docker
  toolchain:
    # Секция обязательна, даже когда окружение docker: без неё сборка падает
    # с «Configuration file amvera.yaml must contain section meta.toolchain».
    name: docker

build:
  # Путь от корня репозитория: контекст сборки — весь репозиторий, потому что
  # образу нужны оба проекта и сертификаты из docker/certs.
  dockerfile: src/Domovoy.Api/Dockerfile

run:
  # Образ слушает http://+:8080 — задано переменной ASPNETCORE_URLS в Dockerfile.
  containerPort: 8080
