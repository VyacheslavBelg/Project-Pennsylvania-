server {
    listen 80;
    server_name _;

    # Приложение собрано с base=/Project-Pennsylvania-/, поэтому локально оно доступно
    # по тому же пути, что и на GitHub Pages: поведение совпадает с продом.
    location = / {
        return 302 /Project-Pennsylvania-/;
    }

    location /Project-Pennsylvania-/ {
        alias /usr/share/nginx/html/Project-Pennsylvania-/;
        index index.html;
        try_files $uri $uri/ /Project-Pennsylvania-/index.html;
    }
}
